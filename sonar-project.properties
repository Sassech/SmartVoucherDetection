# =============================================================================
# SonarQube config — SmartVoucherDetection (smartvoucherdetection)
# =============================================================================
sonar.projectKey=smartvoucherdetection
sonar.projectName=SmartVoucherDetection
sonar.sourceEncoding=UTF-8
sonar.newCode.referenceBranch=main
sonar.scm.provider=git
sonar.sources=api,scripts,infra/scripts,webapp/src,plugin-wp/comprobantes-ocr
sonar.exclusions=api/alembic/versions/**,webapp/src/**/__tests__/**,webapp/src/test-setup.ts,plugin-wp/comprobantes-ocr/block/build/**

sonar.tests=api/tests,webapp/src,webapp/e2e
sonar.test.inclusions=api/tests/**/*.py,webapp/src/**/__tests__/**,webapp/e2e/**/*.spec.ts
sonar.python.version=3.12

# Coverage — generate before scanning: api (pytest --cov-report=xml), webapp (pnpm vitest run --coverage)
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.javascript.lcov.reportPaths=webapp/coverage/lcov.info
# Coverage exclusions — dataset tooling y plugin no tienen tests, no deben bajar el % de coverage
# Thin Next.js wrappers (page.tsx/layout.tsx etc) excluded per node-ts stack: logic tested via imported components
sonar.coverage.exclusions=scripts/**,plugin-wp/**,infra/scripts/**,api/alembic/**,**/page.tsx,**/layout.tsx,**/loading.tsx,**/error.tsx,**/not-found.tsx,next.config.ts

# Issue suppressions — false positives / intentional conventions, scoped by rule + path.
# e1,e2: WordPress PHP Coding Standards require snake_case functions and Capitalized_Underscore classes.
# e3: $history is consumed by the template loaded with include_once (include scope not tracked by Sonar).
# e4: synthetic dataset templates replicate real bank receipt colors on purpose (training realism).
# e5: internal Docker-network default (webapp -> api); TLS terminates at nginx.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=plugin-wp/**/*.php
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=plugin-wp/**/*.php
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1481
sonar.issue.ignore.multicriteria.e3.resourceKey=plugin-wp/comprobantes-ocr/includes/class-history-widget.php
sonar.issue.ignore.multicriteria.e4.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/augment/templates/**
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=webapp/src/lib/**/server-config*.ts

# Como usar el scanner de SonarQube desde Docker:
#   set -a; source .env.sonar; set +a
#   docker run --rm \
#     -v "$(pwd):/usr/src" -w /usr/src \
#     sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1 \
#     -Dsonar.host.url=https://sonarqube.vantus.site \
#     -Dsonar.token="$SONARQUBE_ANALYSIS_TOKEN" \
#     -Dsonar.projectKey=smartvoucherdetection \
#     -Dsonar.qualitygate.wait=true

